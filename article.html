<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>资源详情 · AVDB</title>
<link rel="stylesheet" href="./theme.css"/>
<style>
.back-btn { background:none; border:none; color:var(--accent); font-size:14px; cursor:pointer; padding:4px 0; }
.detail-hero { display:flex; gap:14px; padding:14px 16px; }
.detail-hero .cover { flex-shrink:0; width:100px; aspect-ratio:2/3; border-radius:var(--radius); overflow:hidden; background:var(--bg3); }
.detail-hero .cover img { width:100%; height:100%; object-fit:cover; display:block; }
.section-hd { font-size:14px; font-weight:600; color:var(--text); padding:14px 16px 8px; border-top:1px solid var(--border); margin-top:4px; display:flex; align-items:center; gap:8px; }
.section-hd .sec-action { margin-left:auto; font-size:12px; font-weight:400; }
.magnets-list { padding:0 16px; }
.m-item { background:var(--bg3); border:1px solid var(--border); border-radius:var(--radius); padding:11px 12px; margin-bottom:8px; cursor:pointer; transition:border-color .15s; }
.m-item:hover, .m-item.sel { border-color:var(--accent); background:rgba(108,142,245,.08); }
.m-name { font-size:12px; color:var(--text); margin-bottom:5px; line-height:1.4; word-break:break-all; }
.m-meta { display:flex; flex-wrap:wrap; gap:5px; }
.m-tag { font-size:10px; padding:1px 6px; border-radius:3px; background:var(--surface); color:var(--text2); }
.m-tag.hd  { color:var(--accent); }
.m-tag.sub { color:var(--success); }
.action-bar { display:flex; gap:8px; flex-wrap:wrap; padding:12px 16px; }
.file-item { background:var(--bg3); border:1px solid var(--border); border-radius:var(--radius); padding:11px 12px; margin-bottom:8px; }
.file-name { font-size:12px; color:var(--text); margin-bottom:6px; word-break:break-all; line-height:1.4; }
.file-meta { font-size:11px; color:var(--text3); margin-bottom:8px; }
</style>
</head>
<body>
<div id="app-header"></div>
<div id="app-main">
  <div class="loading-row"><div class="spinner"></div>加载中…</div>
</div>

<script src="./lib.js"></script>
<script>
(function(){
  'use strict';
  var Cfg = AVDBApp.Cfg, AVDB = AVDBApp.AVDB, P115 = AVDBApp.P115, Player = AVDBApp.Player, UI = AVDBApp.UI;
  var main = document.getElementById('app-main');
  var tid = UI.qs('tid');
  var state = { article: null, magnets: [], selMagnet: null };

  Cfg.load().then(function(){
    UI.renderHeader('resources');
    UI.initTvFocus();
    // 先从 storage 拿缓存
    ant.storage.getJSON('res.detail', null).then(function(cached){
      if (cached && String(cached.tid) === String(tid)) {
        state.article = cached;
        renderPage();
      }
      loadMagnets();
    });
  });

  function renderPage() {
    var a = state.article || {};
    var cover = a.cover || a.poster || '';
    var number = a.number || tid || '';
    var title  = a.title  || a.name || number;

    main.innerHTML =
      '<button data-focus class="back-btn" style="margin:10px 16px 0" onclick="history.back()">← 返回</button>' +
      '<div class="detail-hero">' +
        '<div class="cover">' +
          (cover ? '<img src="' + UI.esc(cover) + '" alt="" onerror="this.style.display=\'none\'"/>' : '<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--text3)">🎬</div>') +
        '</div>' +
        '<div class="info">' +
          '<div style="font-size:16px;font-weight:700;margin-bottom:6px;">' + UI.esc(title) + '</div>' +
          '<div style="font-size:12px;color:var(--accent);font-family:monospace;margin-bottom:8px;">' + UI.esc(number) + '</div>' +
          (a.section   ? '<div style="font-size:12px;color:var(--text2);margin-bottom:3px;">分区: ' + UI.esc(a.section)   + '</div>' : '') +
          (a.category  ? '<div style="font-size:12px;color:var(--text2);margin-bottom:3px;">分类: ' + UI.esc(a.category)  + '</div>' : '') +
          (a.website   ? '<div style="font-size:12px;color:var(--text2);margin-bottom:3px;">来源: ' + UI.esc(a.website)   + '</div>' : '') +
          (a.inStock   ? '<div style="font-size:12px;color:var(--success);">✅ 有资源</div>' : '') +
        '</div>' +
      '</div>' +
      // 磁力
      '<div class="section-hd">🧲 磁力资源<span id="magnet-status" class="sec-action">加载中…</span></div>' +
      '<div id="magnets-list" class="magnets-list">' + UI.loadingRow() + '</div>' +
      // 操作
      '<div class="action-bar" id="action-bar" style="display:none">' +
        '<button data-focus class="btn btn-primary" id="btn-send115">📤 发送到115</button>' +
      '</div>' +
      // 115 文件
      '<div class="section-hd">📂 115 文件<button data-focus class="btn btn-sm sec-action" id="btn-find-file">查找文件</button></div>' +
      '<div id="files-list" class="magnets-list"><div class="hint">点击「查找文件」在115中搜索此影片</div></div>';

    document.getElementById('btn-send115').addEventListener('click', sendTo115);
    document.getElementById('btn-find-file').addEventListener('click', find115Files);
  }

  function loadMagnets() {
    if (!tid) return;
    AVDB.getArticleMagnets([Number(tid)]).then(function(data){
      var list = Array.isArray(data) ? data : (data && (data[tid] || data[String(tid)] || Object.values(data)[0] || []));
      state.magnets = (list || []).map(function(m){
        return {
          name:   m.name || m.title || m.magnet || '',
          magnet: m.magnet || m.link || m.url || '',
          size:   m.size || 0,
          isHd:   !!(m.is_hd || m.hd),
          hasSub: !!(m.has_subtitle || m.zh_sub)
        };
      });
      renderMagnets();
    }).catch(function(e){
      var el = document.getElementById('magnets-list');
      if (el) el.innerHTML = '<div class="hint">磁力加载失败：' + UI.esc(UI.errText(e)) + '</div>';
      var st = document.getElementById('magnet-status');
      if (st) st.textContent = '加载失败';
    });
  }

  function renderMagnets() {
    var el = document.getElementById('magnets-list');
    var st = document.getElementById('magnet-status');
    if (!el) return;
    if (st) st.textContent = state.magnets.length ? state.magnets.length + ' 条' : '暂无';
    if (!state.magnets.length) { el.innerHTML = '<div class="hint">暂无磁力资源</div>'; return; }
    el.innerHTML = state.magnets.map(function(m, i){
      return '<div class="m-item" data-index="' + i + '" tabindex="0" data-focus>' +
        '<div class="m-name">' + UI.esc(m.name || m.magnet.slice(0,60)) + '</div>' +
        '<div class="m-meta">' +
          (m.isHd  ? '<span class="m-tag hd">HD</span>'       : '') +
          (m.hasSub? '<span class="m-tag sub">字幕</span>'    : '') +
          (m.size  ? '<span class="m-tag">' + UI.fmtSize(m.size) + '</span>' : '') +
        '</div></div>';
    }).join('');
    el.querySelectorAll('.m-item').forEach(function(item){
      item.addEventListener('click', function(){
        el.querySelectorAll('.m-item').forEach(function(x){ x.classList.remove('sel'); });
        item.classList.add('sel');
        state.selMagnet = state.magnets[Number(item.dataset.index)];
        document.getElementById('action-bar').style.display = 'flex';
      });
    });
  }

  function sendTo115() {
    if (!state.selMagnet) { UI.toast('请先选择一条磁力资源'); return; }
    var link = state.selMagnet.magnet;
    if (!link) { UI.toast('磁力链接为空'); return; }
    var btn = document.getElementById('btn-send115');
    if (btn) { btn.disabled = true; btn.textContent = '发送中…'; }
    AVDB.sendMagnetTo115(link, Cfg.data.p115SavePath)
      .then(function(){ UI.toast('✅ 已发送到115离线'); })
      .catch(function(e){ UI.toast('发送失败：' + UI.errText(e)); })
      .then(function(){ if (btn) { btn.disabled = false; btn.textContent = '📤 发送到115'; } });
  }

  function find115Files() {
    if (!Cfg.has115Cookie()) { UI.toast('请先在设置页填写115 Cookie'); return; }
    var el = document.getElementById('files-list');
    var btn = document.getElementById('btn-find-file');
    if (el) el.innerHTML = UI.loadingRow();
    if (btn) { btn.disabled = true; btn.textContent = '搜索中…'; }
    var keyword = (state.article && (state.article.number || state.article.title)) || tid;
    P115.listFiles(keyword, null, 0).then(function(data){
      var files = (data && data.data && data.data.list) || (data && data.list) || [];
      renderFiles(files);
    }).catch(function(e){
      if (el) el.innerHTML = '<div class="hint">搜索失败：' + UI.esc(UI.errText(e)) + '</div>';
    }).then(function(){ if (btn) { btn.disabled = false; btn.textContent = '查找文件'; } });
  }

  function renderFiles(files) {
    var el = document.getElementById('files-list');
    if (!el) return;
    var videoExts = /\.(mp4|mkv|avi|ts|m2ts|mov|wmv|flv|rmvb|rm|m4v)$/i;
    var videos = files.filter(function(f){ return videoExts.test(f.n || f.fn || ''); });
    if (!videos.length) { el.innerHTML = '<div class="hint">未找到视频文件，下载可能还未完成</div>'; return; }
    el.innerHTML = videos.map(function(f){
      var name = f.n || f.fn || '未知文件';
      var size = UI.fmtSize(f.s || f.fs || 0);
      var pc   = f.pc || f.pick_code || '';
      var title = (state.article && (state.article.title || state.article.number)) || tid;
      return '<div class="file-item">' +
        '<div class="file-name">' + UI.esc(name) + '</div>' +
        '<div class="file-meta">' + size + '</div>' +
        (pc ? '<button data-focus class="btn btn-success btn-sm" data-pc="' + UI.esc(pc) + '" data-title="' + UI.esc(title) + '">▶ 直链播放</button>'
           : '<span style="font-size:11px;color:var(--text3)">无法获取直链</span>') +
      '</div>';
    }).join('');
    el.querySelectorAll('[data-pc]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var origText = btn.textContent;
        btn.disabled = true; btn.textContent = '获取直链…';
        P115.getDownloadUrl(btn.dataset.pc).then(function(r){
          return Player.playDirect(r.url, btn.dataset.title, r.ua);
        }).catch(function(e){ UI.toast('播放失败：' + UI.errText(e)); })
          .then(function(){ btn.disabled = false; btn.textContent = origText; });
      });
    });
  }
})();
</script>
</body>
</html>
