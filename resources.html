<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>资源库 · AVDB</title>
<link rel="stylesheet" href="./theme.css"/>
<style>
.filter-bar { display:flex; gap:6px; padding:10px 16px; flex-wrap:wrap; align-items:center; border-bottom:1px solid var(--border); }
.filter-bar input { flex:1; min-width:120px; background:var(--bg3); border:1px solid var(--border);
  border-radius:var(--radius-sm); color:var(--text); font-size:13px; padding:7px 10px; outline:none; }
.filter-bar input:focus { border-color:var(--accent); }
.filter-select { background:var(--bg3); border:1px solid var(--border); border-radius:var(--radius-sm);
  color:var(--text); font-size:12px; padding:7px 8px; outline:none; }
.article-item { display:flex; gap:12px; padding:12px 16px; border-bottom:1px solid var(--border); cursor:pointer; transition:background .15s; }
.article-item:hover { background:var(--bg3); }
.article-cover { flex-shrink:0; width:60px; aspect-ratio:2/3; border-radius:var(--radius-sm); overflow:hidden; background:var(--surface); }
.article-cover img { width:100%; height:100%; object-fit:cover; display:block; }
.article-cover .ph { width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-size:18px; color:var(--text3); }
.article-info { flex:1; min-width:0; }
.a-number { font-size:13px; font-weight:600; color:var(--accent); font-family:monospace; margin-bottom:3px; }
.a-title  { font-size:13px; color:var(--text); margin-bottom:4px; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
.a-meta   { display:flex; flex-wrap:wrap; gap:4px; }
.a-tag    { font-size:10px; padding:1px 5px; border-radius:3px; background:var(--surface); color:var(--text3); }
.a-tag.stock  { color:var(--success); }
</style>
</head>
<body>
<div id="app-header"></div>

<!-- 筛选栏 -->
<div class="filter-bar">
  <input id="kw-input" type="text" placeholder="番号 / 关键词…" autocomplete="off"/>
  <select id="section-sel" class="filter-select">
    <option value="">分区</option>
    <option value="javdb">JavDB</option>
    <option value="r18">R18</option>
  </select>
  <select id="stock-sel" class="filter-select">
    <option value="">全部</option>
    <option value="1">有资源</option>
    <option value="0">无资源</option>
  </select>
  <button data-focus class="btn btn-primary btn-sm" id="search-btn">搜索</button>
</div>

<div id="app-main">
  <div class="loading-row"><div class="spinner"></div>加载中…</div>
</div>

<script src="./lib.js"></script>
<script>
(function(){
  'use strict';
  var Cfg = AVDBApp.Cfg, AVDB = AVDBApp.AVDB, UI = AVDBApp.UI;
  var main = document.getElementById('app-main');
  var currentPage = 1, loading = false, hasMore = true;
  var currentQuery = {};

  Cfg.load().then(function(){
    UI.renderHeader('resources');
    UI.initTvFocus();
    if (!UI.checkConfig(main)) return;

    // 初始加载
    doSearch({}, 1, true);

    // 绑定搜索
    document.getElementById('search-btn').addEventListener('click', function(){ triggerSearch(); });
    document.getElementById('kw-input').addEventListener('keydown', function(e){
      if (e.key === 'Enter') triggerSearch();
    });

    // 滚动加载更多
    window.addEventListener('scroll', function(){
      if (loading || !hasMore) return;
      if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 200) {
        doSearch(currentQuery, currentPage + 1, false);
      }
    });
  });

  function triggerSearch() {
    var kw      = document.getElementById('kw-input').value.trim();
    var section = document.getElementById('section-sel').value;
    var stock   = document.getElementById('stock-sel').value;
    var q = {
      keyword: kw || null,
      section: section || null,
      inStock: stock === '1' ? true : stock === '0' ? false : null
    };
    doSearch(q, 1, true);
  }

  function doSearch(q, page, reset) {
    if (loading) return;
    loading = true;
    currentQuery = q;
    if (reset) {
      currentPage = 1; hasMore = true;
      main.innerHTML = '<div id="list-wrap"></div>' +
        '<div id="skeleton-wrap">' + skeletonList(6) + '</div>';
    }

    AVDB.searchArticles({
      keyword:  q.keyword,
      section:  q.section,
      inStock:  q.inStock,
      page:     page,
      pageSize: 24
    }).then(function(data){
      currentPage = page;
      var items = normArticles(data);
      var total = data && (data.total || data.count);
      if (items.length < 20) hasMore = false;

      var skeleton = document.getElementById('skeleton-wrap');
      if (skeleton) skeleton.remove();
      var wrap = document.getElementById('list-wrap');
      if (!wrap) { main.innerHTML = '<div id="list-wrap"></div>'; wrap = document.getElementById('list-wrap'); }

      if (reset && !items.length) {
        main.innerHTML = '<div class="hint">没有找到相关资源</div>';
        return;
      }
      items.forEach(function(item){ wrap.appendChild(makeArticleEl(item)); });

      // 加载更多按钮
      var loadMoreEl = document.getElementById('load-more-btn');
      if (loadMoreEl) loadMoreEl.remove();
      if (hasMore) {
        var btn = document.createElement('div');
        btn.id = 'load-more-btn';
        btn.className = 'load-more';
        btn.innerHTML = '<button data-focus class="btn btn-ghost">加载更多</button>';
        btn.querySelector('button').addEventListener('click', function(){
          doSearch(currentQuery, currentPage + 1, false);
        });
        main.appendChild(btn);
      }
    }).catch(function(e){
      if (reset) main.innerHTML = UI.stateHtml('⚠️', '加载失败', UI.esc(UI.errText(e)),
        '<button data-focus class="btn btn-primary" onclick="location.reload()">重试</button>');
      else UI.toast('加载失败：' + UI.errText(e));
    }).then(function(){ loading = false; });
  }

  function normArticles(data) {
    if (!data) return [];
    var list = Array.isArray(data) ? data : (data.list || data.items || data.articles || []);
    return list.map(function(a){
      return {
        tid:      a.tid || a.id || '',
        number:   a.number || a.tid || '',
        title:    a.title || a.name || '',
        cover:    a.cover || a.poster || '',
        section:  a.section || '',
        category: a.category || '',
        inStock:  !!(a.in_stock || a.has_resource),
        website:  a.website || ''
      };
    });
  }

  function makeArticleEl(item) {
    var el = document.createElement('div');
    el.className = 'article-item';
    el.setAttribute('data-focus', '');
    el.setAttribute('tabindex', '0');
    var coverInner = item.cover
      ? '<img src="' + UI.esc(item.cover) + '" alt="" loading="lazy" onerror="this.parentNode.innerHTML=\'<div class=ph>🎬</div>\'">'
      : '<div class="ph">🎬</div>';
    el.innerHTML =
      '<div class="article-cover">' + coverInner + '</div>' +
      '<div class="article-info">' +
        '<div class="a-number">' + UI.esc(item.number) + '</div>' +
        '<div class="a-title">' + UI.esc(item.title || item.number) + '</div>' +
        '<div class="a-meta">' +
          (item.section  ? '<span class="a-tag">' + UI.esc(item.section)  + '</span>' : '') +
          (item.category ? '<span class="a-tag">' + UI.esc(item.category) + '</span>' : '') +
          (item.inStock  ? '<span class="a-tag stock">有资源</span>'                   : '') +
          (item.website  ? '<span class="a-tag">' + UI.esc(item.website)  + '</span>' : '') +
        '</div>' +
      '</div>';
    el.addEventListener('click', function(){
      // 资源中心的文章没有在线 movie_id，跳转到资源详情页
      ant.storage.setJSON('res.detail', item).then(function(){
        ant.navigateTo('article.html?tid=' + encodeURIComponent(item.tid));
      }).catch(function(){ UI.toast('跳转失败'); });
    });
    return el;
  }

  function skeletonList(n) {
    var html = '';
    for (var i = 0; i < n; i++) {
      html += '<div class="article-item">' +
        '<div class="article-cover"><div class="sk sk-poster" style="width:60px"></div></div>' +
        '<div style="flex:1">' +
          '<div class="sk sk-line" style="width:60%;margin-top:6px"></div>' +
          '<div class="sk sk-line" style="width:90%;margin-top:8px"></div>' +
          '<div class="sk sk-line" style="width:45%;margin-top:8px"></div>' +
        '</div></div>';
    }
    return html;
  }
})();
</script>
</body>
</html>
